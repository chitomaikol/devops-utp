<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="clock-app">
      <div class="title-wrap">
        <p class="subtitle">retro time</p>
        <h1>Pixel Clock</h1>
      </div>

      <canvas id="pixelClock" width="320" height="320" aria-label="Reloj estilo pixel art"></canvas>

      <div class="digital-panel">
        <span id="digitalTime">00:00:00</span>
        <span id="dateText">Lun, 01 Ene 2026</span>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
